<!DOCTYPE html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2eee5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="UNO">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>UNO</title>
<style>
:root{--cw:96px;--fs:1;--tcw:min(calc(var(--cw) * 1.3),21vh)}
html[data-theme="light"]{--bg:#f2eee5;--panel:#ffffff;--panel2:#e8e2d5;--text:#17181a;--muted:#4f535a;--line:#cbc2af;--table:#cfe2d4;--table2:#e4efe7;--accent:#c62f22;--hl:#111111;--overlay:rgba(0,0,0,.45)}
html[data-theme="dark"]{--bg:#0f1114;--panel:#1c2026;--panel2:#15181d;--text:#f2f2f2;--muted:#b9bdc5;--line:#38404a;--table:#0e2318;--table2:#183a28;--accent:#ff5a45;--hl:#ffd23f;--overlay:rgba(0,0,0,.65)}
html{font-size:calc(16px * var(--fs));-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
h1,h2,h3{line-height:1.2}

/* ---------- buttons ---------- */
.btn{font-weight:700;font-size:1.05rem;min-height:48px;padding:.55rem 1.1rem;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.big{width:100%;font-size:1.2rem;min-height:56px}
.btn:active,.iconbtn:active{transform:scale(.97)}
.btn.uno{background:#f2b705;color:#111;border-color:#111;font-weight:900;font-size:1.2rem}
.btn.catch{background:#b3261e;color:#fff;border-color:#b3261e;min-height:42px;padding:.25rem .6rem;width:100%;margin-top:.35rem}
.iconbtn{min-width:48px;min-height:48px;font-size:1.35rem;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--text);display:inline-flex;align-items:center;justify-content:center;padding:0}
.pulse{animation:pulse 1.1s ease-in-out infinite}

/* ---------- cards ---------- */
.card{position:relative;flex:0 0 auto;width:var(--cw);height:calc(var(--cw) * 1.48);border-radius:calc(var(--cw) * .11);background:var(--cc,#333);border:calc(var(--cw) * .05) solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.35);color:#fff;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.card.sd{border-color:#0b0b0b;box-shadow:inset 0 0 0 calc(var(--cw) * .03) rgba(255,255,255,.4),0 2px 5px rgba(0,0,0,.45)}
.card .ctr{position:absolute;left:50%;top:47%;width:76%;transform:translate(-50%,-50%)}
.card svg{display:block;width:100%;height:auto}
.card .ix{position:absolute;left:5%;top:2.5%;width:32%;line-height:1}
.ixn{display:block;font-weight:900;font-size:calc(var(--cw) * .28);font-family:"Arial Black",Arial,Helvetica,sans-serif;text-shadow:0 0 3px #000,1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.ixn.sm{font-size:calc(var(--cw) * .2)}
.ixn.u{text-decoration:underline}
.card .band{position:absolute;left:0;right:0;bottom:0;height:16%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.42);font-weight:800;font-size:calc(var(--cw) * .115);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden}
.card .ctag{position:absolute;right:5%;top:4%;font-size:calc(var(--cw) * .1);font-weight:800;background:rgba(0,0,0,.5);padding:1px 4px;border-radius:4px;text-transform:uppercase}
.card.mini{border-width:2px;border-radius:5px}
.card.mini .ctr{width:94%;top:50%}
.card.back{background:repeating-linear-gradient(135deg,#2c313c 0 8px,#21252d 8px 16px)}
.card.back.mini{background:repeating-linear-gradient(135deg,#3a404d 0 4px,#272b33 4px 8px)}

/* ---------- screens ---------- */
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1rem 1rem calc(2rem + env(safe-area-inset-bottom))}
.wrap{max-width:820px;margin:0 auto}
.hero{text-align:center;padding:.5rem 0 1rem}
.hero-cards{display:flex;justify-content:center;align-items:flex-start;height:calc(var(--cw) * 1.75);--cw:74px;margin:.5rem 0 .4rem}
.hero-cards .card:nth-child(1){transform:rotate(-14deg) translate(18px,8px)}
.hero-cards .card:nth-child(2){z-index:1}
.hero-cards .card:nth-child(3){transform:rotate(14deg) translate(-18px,8px)}
.title{font-size:3.4rem;font-weight:900;margin:.2rem 0 0;letter-spacing:.06em;color:var(--accent);font-style:italic}
.sub{margin:.2rem 0 0;color:var(--muted);font-size:1.05rem}
.modes{display:grid;gap:.7rem;margin:.5rem 0 1rem}
.mode{display:flex;gap:.9rem;align-items:center;text-align:left;padding:.75rem;border-radius:18px;border:3px solid var(--line);background:var(--panel)}
.mode.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.mode-ic{--cw:58px;flex:none}
.mode b{font-size:1.15rem;display:block}
.mode-d{display:block;color:var(--muted);font-size:.95rem;margin-top:.15rem}
.row{display:flex;gap:.6rem;margin-top:.7rem}
.row .btn{flex:1}
@media (min-width:720px){.modes{grid-template-columns:repeat(3,1fr)}.mode{flex-direction:column;text-align:center}}
.sec{margin:1rem 0}
.sec h3{margin:0 0 .5rem;font-size:1.1rem}
.seg{display:flex;flex-wrap:wrap;gap:.4rem}
.seg button{flex:1 1 auto;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-weight:700;padding:.3rem .7rem}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.note{color:var(--muted);font-size:.95rem;margin:.4rem 0 0}
.tog{display:flex;align-items:center;gap:.8rem;padding:.65rem .75rem;border:2px solid var(--line);border-radius:14px;background:var(--panel);width:100%;text-align:left;margin-bottom:.45rem}
.tog .sw{width:54px;height:32px;border-radius:999px;background:#8a8f98;position:relative;flex:none;transition:background .15s}
.tog .sw:after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on .sw{background:var(--accent)}
.tog.on .sw:after{left:26px}
.tog small{display:block;color:var(--muted);font-size:.9rem;margin-top:.1rem;font-weight:400}
.toprow{display:flex;align-items:center;gap:.6rem;margin-bottom:.4rem}
.toprow h2{margin:0;flex:1}

/* ---------- rules ---------- */
.tabs{display:flex;gap:.4rem;overflow-x:auto;position:sticky;top:-1rem;background:var(--bg);padding:.6rem 0;z-index:2}
.tabs button{flex:none;min-height:46px;padding:.3rem .9rem;border-radius:999px;border:2px solid var(--line);background:var(--panel);font-weight:700}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.gl{display:flex;gap:.9rem;align-items:center;padding:.7rem;background:var(--panel);border-radius:16px;border:2px solid var(--line);margin-bottom:.6rem}
.gl .cbox{--cw:70px;flex:none}
.gl h3{margin:0 0 .2rem;font-size:1.1rem}
.gl p{margin:0;line-height:1.45}
.row{flex-wrap:wrap}
.stiles{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin:.6rem 0}
@media (min-width:640px){.stiles{grid-template-columns:repeat(3,1fr)}}
.stile{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:.8rem .9rem;text-align:center}
.stile b{display:block;font-size:2.2rem;line-height:1.1}
.stile span{color:var(--muted);font-weight:700;font-size:.95rem}
.stile.win b{color:#2b9a4b}
.stile.loss b{color:#c62f22}
html[data-theme="dark"] .stile.win b{color:#5fd384}
html[data-theme="dark"] .stile.loss b{color:#ff7a68}
.wbar{height:22px;border-radius:11px;overflow:hidden;display:flex;background:var(--panel2);border:2px solid var(--line)}
.wbar i{display:block;height:100%}
.wbar .w{background:#2b9a4b}
.wbar .l{background:#c62f22}
.slegend{display:flex;justify-content:space-between;font-weight:700;margin-top:.3rem;font-size:.95rem}
.smode{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:.6rem .8rem;margin-bottom:.45rem}
.smode small{color:var(--muted);display:block}
.prose{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:.8rem 1rem;margin-bottom:.8rem;line-height:1.5}
.prose ul{padding-left:1.2rem;margin:.4rem 0}
.prose li{margin:.3rem 0}
.prose h3{margin:.2rem 0 .4rem}
table.pts{border-collapse:collapse;width:100%}
table.pts td{padding:.3rem .4rem;border-bottom:1px solid var(--line)}
table.pts td:last-child{text-align:right;font-weight:800}

/* ---------- game ---------- */
.game{display:flex;flex-direction:column;height:100%;min-height:0}
.topbar{display:flex;align-items:center;gap:.45rem;padding:.4rem .55rem;background:var(--panel);border-bottom:2px solid var(--line)}
.tb-mid{flex:1;min-width:0}
.tb-mode{font-weight:800;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebadge{font-weight:800;padding:.3rem .6rem;border-radius:999px;font-size:.85rem;white-space:nowrap}
.sidebadge.light{background:#fff1bd;color:#4d3900;border:2px solid #d9b84e}
.sidebadge.dark{background:#2a1238;color:#f3d7ff;border:2px solid #9b62e0}
.board{flex:1;display:flex;flex-direction:column;min-height:0}
.opps{display:flex;gap:.5rem;padding:.5rem;justify-content:center}
.opp{flex:1 1 0;max-width:290px;min-width:0;background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:.4rem .55rem;position:relative}
.opp.turn{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.opp.out{opacity:.5}
.o-head{display:flex;align-items:center;gap:.4rem;font-weight:800}
.av{width:1.9rem;height:1.9rem;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.o-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.o-score{font-size:.85rem;background:var(--panel2);padding:.1rem .45rem;border-radius:8px}
.o-body{display:flex;align-items:center;gap:.5rem;margin-top:.25rem}
.o-count{flex:none;text-align:center;min-width:2.6rem}
.o-count b{font-size:1.7rem;line-height:1;display:block}
.o-count span{font-size:.8rem;color:var(--muted)}
.o-fan{display:flex;flex:1;min-width:0;overflow:hidden;--cw:30px;padding:2px 0}
.o-fan .card{margin-left:-17px}
.o-fan .card:first-child{margin-left:0}
.o-tag{font-weight:900;text-align:center;border-radius:10px;padding:.15rem .4rem;margin-top:.3rem;font-size:.95rem}
.o-tag.uno{background:#f2b705;color:#111}
.o-tag.out{background:#555;color:#fff}
.o-tag.think{background:var(--accent);color:#fff}
.table{flex:1;min-height:0;margin:0 .5rem .45rem;border-radius:22px;background:radial-gradient(ellipse at center,var(--table2),var(--table));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.55rem;padding:.55rem;position:relative;overflow:hidden}
.game.darkside .table{background:radial-gradient(ellipse at center,#3b2052,#1a0d26)}
.game.darkside .table .status,.game.darkside .table .dirb{color:#f3e8ff}
.piles{display:flex;gap:calc(var(--tcw) * .4);align-items:center;--cw:var(--tcw)}
.pile{position:relative;background:none;border:0;padding:0;display:block}
.pile .plabel{display:block;text-align:center;font-weight:800;font-size:.9rem;margin-top:.25rem}
.game.darkside .pile .plabel{color:#f3e8ff}
.pcount{position:absolute;right:-10px;top:-10px;background:var(--panel);color:var(--text);border:2px solid var(--line);border-radius:999px;font-weight:800;padding:.05rem .5rem;font-size:.9rem;z-index:2}
.pdraw.tap .card{box-shadow:0 0 0 4px var(--hl),0 4px 10px rgba(0,0,0,.4)}
.pdisc .card.top{box-shadow:0 0 0 5px var(--glow),0 4px 12px rgba(0,0,0,.45)}
.pdisc .under{position:absolute;left:0;top:0;width:var(--cw);height:calc(var(--cw) * 1.48);border-radius:calc(var(--cw) * .11);background:#777;transform:rotate(-7deg);opacity:.55}
.pdisc .card.top{position:relative}
.tinfo{display:flex;flex-direction:column;align-items:center;gap:.45rem;width:100%;max-width:580px}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:.4rem;background:var(--panel);border:3px solid var(--line);border-radius:999px;padding:.25rem .7rem;font-weight:700;font-size:1rem}
.chip.col{border-color:var(--chip)}
.chip .sw{width:1.15rem;height:1.15rem;border-radius:50%;background:var(--chip);border:2px solid #000}
.pend{background:#b3261e;color:#fff;font-weight:900;padding:.25rem .8rem;border-radius:999px;font-size:1.05rem;animation:pulse 1s ease-in-out infinite}
.status{font-weight:800;font-size:1.1rem;text-align:center;min-height:1.3em;line-height:1.3}
.dirb{font-weight:700}
.actions{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;min-height:48px}
.hand-wrap{background:var(--panel2);border-top:2px solid var(--line);padding:.25rem .45rem calc(.45rem + env(safe-area-inset-bottom))}
.hand-head{display:flex;justify-content:space-between;font-size:.95rem;color:var(--muted);padding:0 .3rem}
.hand{display:flex;overflow-x:auto;overflow-y:hidden;padding:calc(var(--cw) * .2) .3rem .35rem;-webkit-overflow-scrolling:touch}
.hand .card{transition:transform .15s ease,filter .15s ease;cursor:pointer}
.hand .card.ok{transform:translateY(calc(var(--cw) * -.15));box-shadow:0 0 0 3px var(--hl),0 6px 14px rgba(0,0,0,.4)}
.hand .card.dim{filter:brightness(.62) saturate(.75)}
.hand .card.jump{box-shadow:0 0 0 4px #ffd23f,0 0 14px #ffd23f;animation:pulse 1s ease-in-out infinite}
.hand .card.new{animation:cardin .35s ease-out}
.hand.rows{flex-direction:column;gap:calc(var(--cw) * .2)}
.hand.rows .hrow{display:flex}
.out-msg{padding:1rem;text-align:center;font-weight:700;font-size:1.05rem}
.out-msg .btn{margin-top:.6rem}
.pop{animation:pop .35s ease-out}
.shake{animation:shake .35s}
.flipanim .table{animation:flip .7s ease-in-out}

/* ---------- modal + toast ---------- */
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:50;padding:1rem}
.modal{background:var(--panel);color:var(--text);border-radius:20px;max-width:560px;width:100%;max-height:90vh;max-height:90dvh;overflow:auto;padding:1rem 1.15rem;box-shadow:0 10px 40px rgba(0,0,0,.5);animation:tin .2s ease-out}
.modal h2{margin:.1rem 0 .6rem}
.modal p{line-height:1.45}
.mbtns{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem;justify-content:flex-end}
.mbtns .btn{flex:1 1 auto}
.colours{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.colbtn{min-height:86px;border-radius:16px;border:3px solid rgba(0,0,0,.45);color:#fff;font-weight:900;font-size:1.35rem;text-shadow:0 1px 3px #000,0 0 2px #000}
.plist{display:grid;gap:.5rem}
.plist .btn{display:flex;justify-content:space-between;align-items:center;font-size:1.15rem}
.logl{list-style:none;padding:0;margin:0}
.logl li{padding:.4rem .2rem;border-bottom:1px solid var(--line)}
.res td{padding:.35rem .4rem;border-bottom:1px solid var(--line)}
.res{width:100%;border-collapse:collapse;margin:.4rem 0}
.bar{height:10px;border-radius:5px;background:var(--panel2);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--accent)}
.preview{display:flex;gap:.6rem;justify-content:center;margin-top:.7rem}
.set-sec{margin-bottom:1rem}
.set-sec h3{margin:0 0 .45rem;font-size:1.05rem}
#toast-root{position:fixed;left:50%;top:32%;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:.4rem;align-items:center;pointer-events:none;width:92vw;max-width:520px}
.toast{background:rgba(18,18,22,.93);color:#fff;font-weight:800;font-size:1.15rem;padding:.55rem 1rem;border-radius:14px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.4);animation:tin .25s ease-out;transition:opacity .35s}
.toast.uno{background:#f2b705;color:#111;font-size:1.7rem;border:3px solid #111}
.toast.bad{background:#b3261e}
.toast.big{background:#5b2a86;font-size:1.35rem}
.toast.hide{opacity:0}

@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes pop{0%{transform:scale(1.25) rotate(-8deg)}100%{transform:scale(1) rotate(0)}}
@keyframes cardin{0%{transform:translateY(40px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes tin{0%{transform:translateY(-10px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- landscape phones ---------- */
@media (orientation:landscape) and (max-height:600px){
 .topbar{padding:.2rem .5rem}
 .iconbtn{min-width:42px;min-height:42px}
 .board{flex-direction:row}
 .opps{flex-direction:column;justify-content:flex-start;width:30vw;max-width:250px;padding:.35rem;overflow-y:auto;gap:.35rem}
 .opp{flex:none;max-width:none;padding:.25rem .45rem}
 .o-fan{display:none}
 .opp .o-head{display:flex}
 .opp{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
 .opp .o-head{flex:1;min-width:0}
 .o-body{margin-top:0}
 .o-count{display:flex;align-items:baseline;gap:.3rem;min-width:0}
 .o-count b{font-size:1.35rem;display:inline}
 .o-tag,.btn.catch{width:100%;margin-top:.15rem}
 .table{flex-direction:row;margin:.35rem .35rem .35rem 0;gap:.8rem}
 .tinfo{flex:1;gap:.35rem}
 .hand{padding-top:calc(var(--cw) * .17)}
 #toast-root{top:18%}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<script>
(function () {
'use strict';

/* =========================================================
   CONSTANTS
   ========================================================= */
var LS_SET = 'unoPwa.settings.v1';
var LS_SAVE = 'unoPwa.save.v1';
var LS_STATS = 'unoPwa.stats.v1';
var LIGHT = ['red', 'yellow', 'green', 'blue'];
var DARK = ['pink', 'teal', 'orange', 'purple'];
var HEX = { red: '#d93a2b', yellow: '#f2b705', green: '#2b9a4b', blue: '#2366c8', pink: '#e0479e', teal: '#10a0a0', orange: '#f07a10', purple: '#7a44c4', wild: '#1d1d21' };
var CNAME = { red: 'Red', yellow: 'Yellow', green: 'Green', blue: 'Blue', pink: 'Pink', teal: 'Teal', orange: 'Orange', purple: 'Purple', wild: 'Wild' };
var T = {
  num: { n: 'Number', l: '' },
  skip: { n: 'Skip', l: 'Skip' },
  rev: { n: 'Reverse', l: 'Reverse' },
  d1: { n: 'Draw 1', l: 'Draw 1', d: 1 },
  d2: { n: 'Draw 2', l: 'Draw 2', d: 2 },
  d4: { n: 'Draw 4', l: 'Draw 4', d: 4 },
  d5: { n: 'Draw 5', l: 'Draw 5', d: 5 },
  skipall: { n: 'Skip Everyone', l: 'Skip All' },
  discard: { n: 'Discard All', l: 'Discard All' },
  flip: { n: 'Flip', l: 'Flip' },
  wild: { n: 'Wild', l: 'Wild' },
  w4: { n: 'Wild Draw 4', l: 'Wild +4', d: 4 },
  wd2: { n: 'Wild Draw 2', l: 'Wild +2', d: 2 },
  wr4: { n: 'Wild Reverse Draw 4', l: 'Rev +4', d: 4 },
  w6: { n: 'Wild Draw 6', l: 'Wild +6', d: 6 },
  w10: { n: 'Wild Draw 10', l: 'Wild +10', d: 10 },
  roulette: { n: 'Wild Colour Roulette', l: 'Roulette' },

/* =========================================================
   HUMAN ACTIONS
   ========================================================= */
function me() { return G.players[0]; }
function myTurn() { return !!G && ui.screen === 'game' && G.phase === 'play' && G.cur === 0 && G.awaitHuman && me().human && !me().out && !ui.modal; }
function canPlayHuman(card) { return legal(card) && (!G.drewCard || card.id === G.drewCard); }
function canHumanJump(card) {
  if (!jumpInOn() || G.phase !== 'play' || G.pending > 0 || G.lastPlayer === 0 || me().out || ui.modal) return false;
  var top = face(topCard());

}
function hint() {
  if (G.drewCard) return 'You can only play the card you just drew' + (G.mode === 'nomercy' ? '.' : ', or Pass.');
  if (G.pending > 0) return 'Only a draw card of +' + G.pendingMin + ' or more can be stacked.';
  var top = face(topCard());
  var alt = isWild(top) ? '' : (top.t === 'num' ? ', a ' + top.v : ', a ' + T[top.t].n);
  return 'Play a ' + CNAME[G.color] + ' card' + alt + ', or a Wild.';
}
function shake(el) {
  if (!el) return;
  el.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('shake');
}
function onCardTap(id, el) {
  if (!G || G.phase !== 'play' || ui.modal) return;
  var m = me();
  if (!m.human || m.out) return;
  var card = findCard(m.hand, id);
  if (!card) return;
  if (!myTurn()) {
    if (canHumanJump(card)) { doJumpIn(0, id); return; }
    shake(el);
    toast(G.cur === 0 ? 'Just a moment\u2026' : 'Wait for your turn');
    return;
  }
  if (!canPlayHuman(card)) { shake(el); toast(hint(), 'bad'); return; }
  var f = face(card);

function humanDraw() {
  if (!G || G.phase !== 'play') return;

  if (G.pending > 0) { takePenalty(0); return; }
  if (G.drewCard) return;
  G.awaitHuman = false;
  clearJump();
  var got = drawUntilOn() ? drawUntilPlayable(0) : drawCards(0, 1);
  log('You draw ' + got.length + (got.length === 1 ? ' card.' : ' cards.'));
  if (got.length > 1) toast('You drew ' + got.length + ' cards');
  var r = checkMercy(0);
  if (r === 'end') return;
  if (r === 'out') { advance(0, 1); return; }
  var last = got[got.length - 1];
  if (last && legal(last)) {
    G.drewCard = last.id;
    G.awaitHuman = true;
    setStatus(G.mode === 'nomercy' ? 'You drew a card you can play \u2014 play it.' : 'You drew a card you can play. Play it, or Pass.');
    render();
    return;
  }
  setStatus(got.length ? 'No match \u2014 your turn passes.' : 'No cards left to draw \u2014 your turn passes.');

}

}

  if (!G || G.phase !== 'play') return;
  var m = me();

  } else if (tab === 'nomercy') {

      '<li><b>Stacking:</b> when a draw card is played on you, you can pass it on with any draw card of the same or higher value (a +4 on a +2, a +10 on a +6\u2026). The player who can\u2019t stack takes the whole total and misses their turn.</li>' +
      '<li><b>Draw until you can play:</b> if you can\u2019t play, keep drawing until you can \u2014 then you must play that card.</li>' +
      '<li><b>7:</b> swap hands with a player of your choice. <b>0:</b> everyone passes their hand to the next player in the direction of play.</li>' +
      '<li><b>Mercy Rule:</b> anyone with 25 or more cards is knocked out.</li>' +
      '<li><b>Win</b> by emptying your hand, or by being the last player still in.</li></ul></div>';
    h += gl(F('red', 'num', 5), 'light', 'Number cards (0\u20139)', 'Same as Classic \u2014 but watch out for 7s and 0s.');
    h += gl(F('yellow', 'skip'), 'light', 'Skip', 'The next player misses their turn.');
    h += gl(F('green', 'rev'), 'light', 'Reverse', 'Changes direction. With 2 players it works like a Skip.');
    h += gl(F('blue', 'd2'), 'light', 'Draw 2', 'Next player draws 2 (or stacks).');
    h += gl(F('red', 'd4'), 'light', 'Draw 4 (coloured)', 'Next player draws 4 (or stacks). Played like a normal coloured card.');
    h += gl(F('blue', 'discard'), 'light', 'Discard All', 'Play it, and every other card of that colour in your hand goes down with it.');
    h += gl(F('green', 'skipall'), 'light', 'Skip Everyone', 'Every other player is skipped \u2014 you go again straight away.');
    h += gl(F('wild', 'wr4'), 'light', 'Wild Reverse Draw 4', 'Choose a colour and reverse the direction. The next player in the new direction draws 4 (or stacks).');
    h += gl(F('wild', 'w6'), 'light', 'Wild Draw 6', 'Choose a colour; next player draws 6 (or stacks a +6 or +10).');
    h += gl(F('wild', 'w10'), 'light', 'Wild Draw 10', 'Choose a colour; next player draws 10 (or stacks another +10).');
    h += gl(F('wild', 'roulette'), 'light', 'Wild Colour Roulette', 'The next player picks a colour, then turns over cards from the draw pile until that colour appears. They keep every card and miss their turn.');
  } else if (tab === 'flip') {
    h += '<div class="prose"><h3>Two sides</h3><p>Every card has a <b>Light Side</b> and a <b>Dark Side</b>. You start on the Light Side. When a <b>Flip</b> card is played, everything turns over \u2014 your hand, the draw pile and the discard pile \u2014 and play carries on with the other side.</p>' +
      '<p>You can see the <i>other</i> side of your opponents\u2019 cards and of the top draw card. Use it to guess what they\u2019ll be holding after a flip!</p><p>The table turns purple on the Dark Side, and the badge at the top tells you which side you\u2019re on.</p></div>';
    h += '<div class="prose"><h3>Light Side</h3></div>';
    h += gl(F('red', 'num', 3), 'light', 'Number cards (1\u20139)', 'Match colour or number.');
    h += gl(F('yellow', 'd1'), 'light', 'Draw 1', 'Next player draws 1 card and misses their turn.');
    h += gl(F('green', 'rev'), 'light', 'Reverse', 'Changes direction (a Skip with 2 players).');
    h += gl(F('blue', 'skip'), 'light', 'Skip', 'Next player misses their turn.');
    h += gl(F('red', 'flip'), 'light', 'Flip', 'Everything flips to the Dark Side.');
    h += gl(F('wild', 'wild'), 'light', 'Wild', 'Choose the next colour.');
    h += gl(F('wild', 'wd2'), 'light', 'Wild Draw 2', 'Choose a colour; next player draws 2 and misses their turn.');
    h += '<div class="prose"><h3>Dark Side</h3></div>';
    h += gl(F('pink', 'num', 8), 'dark', 'Number cards (1\u20139)', 'Pink, teal, orange and purple.');
    h += gl(F('teal', 'd5'), 'dark', 'Draw 5', 'Next player draws 5 cards and misses their turn.');
    h += gl(F('orange', 'rev'), 'dark', 'Reverse', 'Changes direction (a Skip with 2 players).');
    h += gl(F('purple', 'skipall'), 'dark', 'Skip Everyone', 'Everyone else is skipped \u2014 you go again.');
    h += gl(F('pink', 'flip'), 'dark', 'Flip', 'Everything flips back to the Light Side.');
    h += gl(F('wild', 'wild'), 'dark', 'Wild', 'Choose the next colour.');
    h += gl(F('wild', 'wdc'), 'dark', 'Wild Draw Colour', 'Choose a colour; the next player draws until they get a card of that colour, and misses their turn.');
    h += '<div class="prose"><h3>Flip scoring</h3><table class="pts"><tr><td>Number cards</td><td>Face value</td></tr><tr><td>Draw 1</td><td>10</td></tr>' +
      '<tr><td>Draw 5, Reverse, Skip, Flip</td><td>20</td></tr><tr><td>Skip Everyone</td><td>30</td></tr><tr><td>Wild</td><td>40</td></tr><tr><td>Wild Draw 2</td><td>50</td></tr><tr><td>Wild Draw Colour</td><td>60</td></tr></table></div>';
  } else if (tab === 'house') {
    h += '<div class="prose"><p>House rules apply to <b>Classic UNO</b>. Turn them on or off on the game options screen before you start. By default only the official Wild Draw 4 challenge is on.</p></div>';
    HOUSE.forEach(function (r) { h += '<div class="prose"><h3>' + r[1] + '</h3><p style="margin:0">' + r[2] + '</p></div>'; });
  }
  return h;
}
function renderRules() {
  var tabs = [['basics', 'Basics'], ['classic', 'Classic'], ['nomercy', 'No Mercy'], ['flip', 'Flip'], ['house', 'House rules']];
  var h = '<div class="screen"><div class="wrap"><div class="toprow"><button class="iconbtn" data-act="rules-back" aria-label="Back">\u2039</button><h2>Rules & cards</h2></div><div class="tabs">';
  tabs.forEach(function (t) { h += '<button class="' + (ui.rulesTab === t[0] ? 'on' : '') + '" data-act="rtab" data-v="' + t[0] + '">' + t[1] + '</button>'; });
  h += '</div>' + rulesContent(ui.rulesTab) + '</div></div>';
  return h;
}

/* ----- game screen ----- */
function oppHTML(i) {
  var p = G.players[i];
  var cls = 'opp' + (G.cur === i && G.phase === 'play' ? ' turn' : '') + (p.out ? ' out' : '');
  var h = '<div class="' + cls + '"><div class="o-head"><span class="av" style="background:' + p.col + '">' + esc(p.name.charAt(0)) + '</span><span class="o-name">' + esc(p.name) + '</span>' +
    (G.target ? '<span class="o-score">' + p.score + ' pts</span>' : '') + '</div>';
  h += '<div class="o-body"><div class="o-count"><b>' + p.hand.length + '</b><span>' + (p.hand.length === 1 ? 'card' : 'cards') + '</span></div><div class="o-fan">';
  var n = Math.min(p.hand.length, 14), os = otherSide();
  for (var k = 0; k < n; k++) h += G.mode === 'flip' ? cardHTML(face(p.hand[k], os), os, { mini: true }) : backHTML(true);
  h += '</div></div>';
  if (p.out) h += '<div class="o-tag out">OUT</div>';
  else if (p.hand.length === 1 && p.unoVuln && me().human && !me().out) h += '<button class="btn catch" data-act="catch" data-pi="' + i + '">\u270B Catch! No UNO</button>';
  else if (p.hand.length === 1) h += '<div class="o-tag uno">UNO!</div>';
  else if (G.cur === i && G.phase === 'play') h += '<div class="o-tag think">Their turn</div>';
  return h + '</div>';
}
function tableHTML() {
  var tf = face(topCard()), m = me();
  var canDraw = myTurn() && !G.drewCard;
  var h = '<div class="piles"><button class="pile pdraw' + (canDraw ? ' tap' : '') + '" data-act="draw" aria-label="Draw pile, ' + G.draw.length + ' cards">';
  if (G.mode === 'flip' && G.draw.length) { var os = otherSide(); h += cardHTML(face(G.draw[G.draw.length - 1], os), os); }
  else h += backHTML(false);
  h += '<span class="pcount">' + G.draw.length + '</span><span class="plabel">' + (G.pending > 0 && myTurn() ? 'Take ' + G.pending : 'Draw') + '</span></button>';
  h += '<div class="pile pdisc"><div class="under"></div>' + cardHTML(tf, G.side, { cls: 'top' + (G.seq !== ui.lastSeq ? ' pop' : ''), style: '--glow:' + HEX[G.color] }) +
    '<span class="plabel">Discard</span></div></div>';
  h += '<div class="tinfo"><div class="chips"><span class="chip col" style="--chip:' + HEX[G.color] + '"><span class="sw"></span>Colour: <b>' + CNAME[G.color] + '</b></span>' +
    '<span class="chip dirb">' + (G.dir === 1 ? '\u21BB Clockwise' : '\u21BA Anticlockwise') + '</span>' +
    (G.pending > 0 ? '<span class="pend">+' + G.pending + ' to draw</span>' : '') + '</div>';
  h += '<div class="status">' + esc(G.status || '') + '</div><div class="actions">';
  if (myTurn()) {
    if (G.pending > 0) {
      h += '<button class="btn primary" data-act="penalty">Take ' + G.pending + ' card' + (G.pending === 1 ? '' : 's') + '</button>';
      if (G.challenge && challengeOn()) h += '<button class="btn" data-act="challenge">Challenge!</button>';
    } else if (!G.drewCard) h += '<button class="btn primary" data-act="draw">Draw a card</button>';
    else if (G.mode !== 'nomercy') h += '<button class="btn" data-act="pass">Pass</button>';
  }
  var showUno = m.human && !m.out && G.phase === 'play' && ((m.hand.length === 2 && myTurn() && !m.saidUno) || m.unoVuln);
  if (showUno) h += '<button class="btn uno pulse" data-act="uno">UNO!</button>';
  h += '</div></div>';
  return h;
}
function handHTML() {
  var m = me();
  if (m.out) return '<div class="hand-wrap"><div class="out-msg">You\u2019re out (25 cards or more). The computer players are finishing the round.<br><button class="btn" data-act="quit">Leave game</button></div></div>';
  var mt = myTurn(), cards = S.sortHand ? sortHand(m.hand) : m.hand, h = '';
  cards.forEach(function (c) {
    var cls = '';
    if (mt && S.highlight) cls = canPlayHuman(c) ? 'ok' : 'dim';
    else if (!mt && G.cur !== 0 && canHumanJump(c)) cls = 'jump';
    if (ui.newIds.indexOf(c.id) >= 0) cls += ' new';
    h += cardHTML(face(c), G.side, { id: c.id, cls: cls });
  });
  return '<div class="hand-wrap"><div class="hand-head"><span>Your cards: <b>' + m.hand.length + '</b></span>' + (G.target ? '<span>Your score: <b>' + m.score + '</b></span>' : '') +
    '</div><div class="hand" id="hand">' + h + '</div></div>';
}
function renderGame() {
  var N = G.players.length;
  var sub = G.target ? ('Round ' + G.round + ' \u00b7 first to ' + G.target) : (N + ' players \u00b7 ' + cap(G.difficulty));
  var h = '<div class="game' + (G.side === 'dark' ? ' darkside' : '') + (ui.flipAnim ? ' flipanim' : '') + '">';
  h += '<div class="topbar"><button class="iconbtn" data-act="menu" aria-label="Menu">\u2630</button><div class="tb-mid"><div class="tb-mode">' + MODES[G.mode].n + '</div><div class="tb-sub">' + sub + '</div></div>' +
    (G.mode === 'flip' ? '<span class="sidebadge ' + G.side + '">' + (G.side === 'dark' ? '\u263E Dark Side' : '\u2600 Light Side') + '</span>' : '') +
    '<button class="iconbtn" data-act="log" aria-label="What happened">\uD83D\uDCDC</button><button class="iconbtn" data-act="settings" aria-label="Settings">\u2699</button></div>';
  h += '<div class="board"><div class="opps">';
  for (var i = 1; i < N; i++) h += oppHTML(i);
  h += '</div><div class="table">' + tableHTML() + '</div></div>';
  h += handHTML() + '</div>';
  return h;
}
function layoutHand() {
  var hand = document.getElementById('hand');
  if (!hand) return;
  var cards = [], i, list = hand.querySelectorAll('.card');
  for (i = 0; i < list.length; i++) cards.push(list[i]);
  if (hand.className !== 'hand') {           /* flatten a previous two-row layout */
    hand.className = 'hand';
    hand.innerHTML = '';
    cards.forEach(function (c) { hand.appendChild(c); });
  }
  if (!cards.length) { layoutTable(); return; }
  var n = cards.length, cw = cards[0].offsetWidth, W = hand.clientWidth - 12, gap = 6;
  if (!cw) return;
  var stepFor = function (k) { return k <= 1 ? cw + gap : Math.min(cw + gap, Math.max(cw * 0.42, (W - cw) / (k - 1))); };
  var place = function (rows) {
    rows.forEach(function (r) {
      var k = r.length, step = stepFor(k);
      for (var j = 0; j < k; j++) r[j].style.marginLeft = j === 0 ? '0' : (step - cw) + 'px';
      var box = rows.length > 1 ? r[0].parentNode : hand;
      box.style.justifyContent = k * (cw + gap) <= W ? 'center' : 'flex-start';
    });
  };
  var portrait = window.innerHeight > window.innerWidth;
  if (portrait && n >= 5 && stepFor(n) < cw * 0.7) {
    /* Try two rows so more of each card shows - but only if the table still has room */
    var half = Math.ceil(n / 2), rows = [cards.slice(0, half), cards.slice(half)];
    hand.className = 'hand rows';
    hand.innerHTML = '';
    rows.forEach(function (r) {
      var d = document.createElement('div');
      d.className = 'hrow';
      r.forEach(function (c) { d.appendChild(c); });
      hand.appendChild(d);
    });
    place(rows);
    if (tableRoom() < cw * 0.95 * 1.48) {
      hand.className = 'hand';
      hand.innerHTML = '';
      cards.forEach(function (c) { hand.appendChild(c); });
      place([cards]);
    }
  } else place([cards]);
  layoutTable();
}
/* Height left for the pile cards once the colour chips, status and buttons are placed */
function tableRoom() {
  var t = app.querySelector('.table'), info = app.querySelector('.tinfo');
  if (!t || !info) return 999;
  var row = getComputedStyle(t).flexDirection === 'row';
  return t.clientHeight - 20 - 30 - (row ? 0 : info.offsetHeight + 10);
}
function layoutTable() {
  var piles = app.querySelector('.piles');
  if (!piles) return;
  var cw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cw')) || 96;
  var w = Math.max(48, Math.min(cw * 1.3, tableRoom() / 1.48));
  piles.style.setProperty('--tcw', Math.floor(w) + 'px');
}

/* =========================================================
   EVENTS
   ========================================================= */
function findTarget(t, root) {
  while (t && t !== root) {
    if (t.getAttribute && (t.getAttribute('data-act') || t.getAttribute('data-id') || t.getAttribute('data-mi') !== null)) return t;
    t = t.parentNode;
  }
  return null;
}
function doAct(act, el) {
  var k = el.getAttribute('data-k'), v = el.getAttribute('data-v');
  switch (act) {
    case 'mode': S.mode = v; saveSettings(); render(); break;
    case 'setup': show('setup'); break;
    case 'back': show('home'); break;
    case 'set':
      S[k] = k === 'players' ? parseInt(v, 10) : v;
      saveSettings(); render(); break;
    case 'rule': S.rules[k] = !S.rules[k]; saveSettings(); render(); break;
    case 'start': clearSave(); newGame(); break;
    case 'resume': resumeSaved(); break;
    case 'rules': openRules(); break;
    case 'rtab': ui.rulesTab = v; render(); break;
    case 'rules-back':
      show(G && ui.rulesReturn === 'game' ? 'game' : 'home');
      if (ui.screen === 'game') unpause();
      break;
    case 'settings': showSettings(); break;
    case 'st': S[k] = k === 'fs' ? parseFloat(v) : v; settingsChanged(); break;
    case 'sttog': S[k] = !S[k]; settingsChanged(); break;
    case 'menu': showMenu(); break;
    case 'log': showLog(); break;
    case 'draw': humanDraw(); break;
    case 'pass': humanPass(); break;
    case 'penalty': if (myTurn() && G.pending > 0) takePenalty(0); break;
    case 'challenge': if (myTurn() && G.challenge) doChallenge(0); break;
    case 'uno': humanUno(); break;
    case 'catch':
      var pi = parseInt(el.getAttribute('data-pi'), 10);
      if (G && G.phase === 'play' && G.players[pi].unoVuln) catchPlayer(0, pi);
      break;
    case 'quit': clearTimers(); ui.paused = false; show('home'); break;
    case 'stats': show('stats'); break;
    case 'stab': ui.statsTab = v; render(); break;
    case 'stats-reset':
      showModal({ title: 'Reset all stats?', html: '<p>This clears your games, wins, losses and streaks for every mode. It can\u2019t be undone.</p>',
        buttons: [{ label: 'Yes, reset', cls: 'primary', fn: function () { try { localStorage.removeItem(LS_STATS); } catch (e) {} render(); toast('Stats reset'); } }, { label: 'Cancel' }] });
      break;
  }
}
function init() {
  app = document.getElementById('app');
  mroot = document.getElementById('modal-root');
  troot = document.getElementById('toast-root');
  if (AUTOPLAY) {
    window.__uno = { rounds: 0, games: 0, max: parseInt(qp('games') || '20', 10), wins: {}, errors: [], stalls: 0, done: false };
    S.mode = qp('mode') || 'classic';
    S.players = parseInt(qp('players') || '4', 10);
    S.difficulty = qp('diff') || 'normal';
    S.length = qp('length') || 'round';
    var rl = qp('rules');
    if (rl) { for (var r in S.rules) if (S.rules.hasOwnProperty(r)) S.rules[r] = rl === 'all' || rl.indexOf(r) >= 0; }
    window.onerror = function (m, s, l, c, e) { window.__uno.errors.push(String(e && e.stack || m)); };
  }
  applySettings();
  app.addEventListener('click', function (e) {
    var t = findTarget(e.target, app);
    if (!t) return;
    var id = t.getAttribute('data-id');
    if (id) { onCardTap(parseInt(id, 10), t); return; }
    var act = t.getAttribute('data-act');
    if (act) doAct(act, t);
  });
  mroot.addEventListener('click', function (e) {
    var t = findTarget(e.target, mroot);
    if (!t) return;
    var mi = t.getAttribute('data-mi');
    if (mi !== null) {
      var fn = ui.modalFns[parseInt(mi, 10)];
      closeModal();
      if (fn) guard(fn)();
      return;
    }
    var act = t.getAttribute('data-act');
    if (act) doAct(act, t);
  });
  var rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () { applySettings(); if (ui.screen === 'game') layoutHand(); }, 120);
  });
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onScheme = function () { if (S.theme === 'auto') applySettings(); };
    if (mq.addEventListener) mq.addEventListener('change', onScheme); else if (mq.addListener) mq.addListener(onScheme);
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden && G && G.phase === 'play') saveGame(); });
  if (AUTOPLAY) { newGame(); return; }
  render();
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
}

window.addEventListener('load', init);
})();
</script>
